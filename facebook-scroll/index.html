<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FB Reels - Video Populer Facebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1877F2;
            --primary-dark: #166FE5;
            --secondary: #F0F2F5;
            --text-primary: #FFFFFF;
            --text-secondary: #BCC0C4;
            --bg-dark: #000000;
            --bg-card: #1C1E21;
            --gradient-start: #1877F2;
            --gradient-end: #6942F5;
            --accent-hot: #FF6B6B;
            --accent-like: #E91E63;
            --shadow-glow: rgba(24, 119, 242, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            height: 100%;
            width: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 0;
            display: none;
        }

        /* Video Feed Container */
        .video-feed {
            height: 100%;
            width: 100%;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .video-feed::-webkit-scrollbar {
            display: none;
        }

        /* Video Card */
        .video-card {
            height: 100vh;
            width: 100vw;
            position: relative;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Gradient Overlay */
        .video-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70%;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.9) 0%,
                rgba(0, 0, 0, 0.6) 30%,
                rgba(0, 0, 0, 0.2) 50%,
                transparent 100%
            );
            pointer-events: none;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #0a0a0f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-logo {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end), var(--accent-hot));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(24, 119, 242, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            animation: fadeInOut 2s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem 1.5rem;
            padding-top: max(1rem, env(safe-area-inset-top));
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #b8c5d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-title svg {
            width: 28px;
            height: 28px;
        }

        .header-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .header-tab {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .header-tab.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .header-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Content Info */
        .content-info {
            position: absolute;
            bottom: 6rem;
            left: 1rem;
            right: 5rem;
            z-index: 50;
        }

        .creator-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
            box-shadow: 0 0 20px var(--shadow-glow);
        }

        .creator-details {
            flex: 1;
        }

        .creator-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .verified-badge {
            width: 18px;
            height: 18px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verified-badge svg {
            width: 12px;
            height: 12px;
            fill: white;
        }

        .post-time {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .video-description {
            font-size: 0.95rem;
            line-height: 1.4;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .hashtags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .hashtag {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .hashtag:hover {
            color: var(--accent-hot);
        }

        /* Side Actions */
        .side-actions {
            position: absolute;
            right: 1rem;
            bottom: 6rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 50;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .action-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .action-icon svg {
            width: 24px;
            height: 24px;
            fill: var(--text-primary);
            transition: fill 0.3s ease;
        }

        .action-btn.like .action-icon:hover {
            background: var(--accent-like);
            box-shadow: 0 0 30px rgba(233, 30, 99, 0.5);
        }

        .action-btn.like.active .action-icon {
            background: var(--accent-like);
            animation: likeAnimation 0.4s ease;
        }

        .action-btn.like.active .action-icon svg {
            fill: white;
        }

        .action-btn.share .action-icon:hover {
            background: var(--primary);
            box-shadow: 0 0 30px var(--shadow-glow);
        }

        .action-btn.comment .action-icon:hover {
            background: #25D366;
            box-shadow: 0 0 30px rgba(37, 211, 102, 0.5);
        }

        .action-btn.save .action-icon:hover {
            background: var(--accent-hot);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
        }

        .action-btn.save.active .action-icon {
            background: var(--accent-hot);
        }

        .action-btn.save.active .action-icon svg {
            fill: white;
        }

        .action-count {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        @keyframes likeAnimation {
            0% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        /* Progress Bar */
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 100;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Sound Indicator */
        .sound-indicator {
            position: absolute;
            top: 6rem;
            right: 1rem;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sound-indicator:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        .sound-wave {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 16px;
        }

        .sound-bar {
            width: 3px;
            background: var(--text-primary);
            border-radius: 2px;
            animation: soundWave 0.8s ease-in-out infinite;
        }

        .sound-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
        .sound-bar:nth-child(2) { height: 12px; animation-delay: 0.1s; }
        .sound-bar:nth-child(3) { height: 8px; animation-delay: 0.2s; }
        .sound-bar:nth-child(4) { height: 14px; animation-delay: 0.3s; }
        .sound-bar:nth-child(5) { height: 10px; animation-delay: 0.4s; }

        .sound-indicator.muted .sound-bar {
            animation: none;
            height: 4px !important;
            opacity: 0.5;
        }

        .sound-text {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        @keyframes soundWave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.5); }
        }

        /* Video Controls */
        .video-controls {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2rem;
            z-index: 50;
        }

        .control-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text-primary);
        }

        .control-btn.playing {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* Play Button Overlay */
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 60;
        }

        .play-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .play-overlay:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .play-overlay svg {
            width: 36px;
            height: 36px;
            fill: var(--text-primary);
            margin-left: 4px;
        }

        /* Share Modal */
        .share-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            padding: 1.5rem;
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
            z-index: 200;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .share-modal.visible {
            transform: translateY(0);
        }

        .share-modal::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }

        .share-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .share-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .share-option:hover {
            transform: scale(1.1);
        }

        .share-icon {
            width: 55px;
            height: 55px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .share-icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .share-icon.facebook { background: #1877F2; }
        .share-icon.twitter { background: #1DA1F2; }
        .share-icon.whatsapp { background: #25D366; }
        .share-icon.link { background: #333; }

        .share-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .copy-link-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-link-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 30px var(--shadow-glow);
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-backdrop.visible {
            opacity: 1;
            visibility: visible;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .toast.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .toast-text {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        /* Swipe Hint */
        .swipe-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 80;
            opacity: 1;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .swipe-hint.hidden {
            opacity: 0;
        }

        .swipe-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            animation: swipeUp 2s ease-in-out infinite;
        }

        .swipe-icon svg {
            width: 100%;
            height: 100%;
            fill: rgba(255, 255, 255, 0.8);
        }

        .swipe-text {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
        }

        @keyframes swipeUp {
            0%, 100% { transform: translateY(0); opacity: 0.8; }
            50% { transform: translateY(-20px); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .header {
                padding: 0.75rem 1rem;
                padding-top: max(0.75rem, env(safe-area-inset-top));
            }

            .header-title {
                font-size: 1.2rem;
            }

            .header-tabs {
                gap: 0.3rem;
            }

            .header-tab {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }

            .content-info {
                bottom: 5.5rem;
                left: 0.75rem;
                right: 4.5rem;
            }

            .avatar {
                width: 40px;
                height: 40px;
            }

            .creator-name {
                font-size: 0.9rem;
            }

            .video-description {
                font-size: 0.85rem;
            }

            .side-actions {
                right: 0.75rem;
                bottom: 5.5rem;
                gap: 1.25rem;
            }

            .action-icon {
                width: 44px;
                height: 44px;
            }

            .action-icon svg {
                width: 22px;
                height: 22px;
            }

            .video-controls {
                bottom: 1rem;
                gap: 1.5rem;
            }

            .control-btn {
                width: 40px;
                height: 40px;
            }
        }

        /* Category Badge */
        .category-badge {
            position: absolute;
            top: 5.5rem;
            left: 1rem;
            z-index: 100;
            padding: 0.4rem 0.8rem;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }

        .category-badge svg {
            width: 14px;
            height: 14px;
            fill: var(--accent-hot);
        }

        .category-badge span {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Engagement Tags */
        .engagement-tags {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .engagement-tag {
            padding: 0.3rem 0.6rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: 600;
        }

        .engagement-tag.hot {
            background: rgba(255, 107, 107, 0.2);
            color: var(--accent-hot);
        }

        .engagement-tag.trending {
            background: rgba(105, 66, 245, 0.2);
            color: #6942F5;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Loading Screen -->
        <div class="loading-screen" id="loadingScreen">
            <div class="loading-logo">FB Reels</div>
            <div class="loading-spinner"></div>
            <div class="loading-text">Memuat video populer...</div>
        </div>

        <!-- Header -->
        <header class="header">
            <div class="header-title">
                <svg viewBox="0 0 24 24" fill="url(#fbGradient)">
                    <defs>
                        <linearGradient id="fbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#1877F2"/>
                            <stop offset="100%" style="stop-color:#6942F5"/>
                        </linearGradient>
                    </defs>
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                FB Reels
            </div>
            <div class="header-tabs">
                <button class="header-tab active">Untuk Anda</button>
                <button class="header-tab">Mengikuti</button>
            </div>
        </header>

        <!-- Sound Indicator -->
        <div class="sound-indicator" id="soundIndicator">
            <div class="sound-wave">
                <div class="sound-bar"></div>
                <div class="sound-bar"></div>
                <div class="sound-bar"></div>
                <div class="sound-bar"></div>
                <div class="sound-bar"></div>
            </div>
            <span class="sound-text" id="soundText">Suara</span>
        </div>

        <!-- Category Badge -->
        <div class="category-badge" id="categoryBadge">
            <svg viewBox="0 0 24 24"><path d="M17.5 2.5L23 8l-5.5 5.5-5-5L17.5 2.5zM13.5 6.5L11 9l4.5 4.5 2.5-2.5-4.5-4.5zM2 22l6-6 4 4L6 26 2 22z"/></svg>
            <span id="categoryText">🔥 Trending</span>
        </div>

        <!-- Video Feed -->
        <div class="video-feed" id="videoFeed">
            <!-- Videos will be inserted here by JavaScript -->
        </div>

        <!-- Swipe Hint -->
        <div class="swipe-hint" id="swipeHint">
            <div class="swipe-icon">
                <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            </div>
            <div class="swipe-text">Geser ke atas untuk video berikutnya</div>
        </div>

        <!-- Video Controls -->
        <div class="video-controls" id="videoControls">
            <button class="control-btn" id="prevBtn">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <button class="control-btn playing" id="playPauseBtn">
                <svg viewBox="0 0 24 24" id="playIcon"><rect fill="currentColor" x="6" y="4" width="4" height="16"/><rect fill="currentColor" x="14" y="4" width="4" height="16"/></svg>
            </button>
            <button class="control-btn" id="nextBtn">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
        </div>

        <!-- Modal Backdrop -->
        <div class="modal-backdrop" id="modalBackdrop"></div>

        <!-- Share Modal -->
        <div class="share-modal" id="shareModal">
            <div class="share-title">Bagikan Video</div>
            <div class="share-options">
                <div class="share-option">
                    <div class="share-icon facebook">
                        <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    </div>
                    <span class="share-label">Facebook</span>
                </div>
                <div class="share-option">
                    <div class="share-icon twitter">
                        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    </div>
                    <span class="share-label">Twitter</span>
                </div>
                <div class="share-option">
                    <div class="share-icon whatsapp">
                        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    </div>
                    <span class="share-label">WhatsApp</span>
                </div>
                <div class="share-option" id="copyLinkBtn">
                    <div class="share-icon link">
                        <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
                    </div>
                    <span class="share-label">Salin Link</span>
                </div>
            </div>
            <button class="copy-link-btn" id="closeShareModal">Tutup</button>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast">
            <span class="toast-text" id="toastText">Berhasil!</span>
        </div>
    </div>

    <script>
        // Sample video data (simulating popular Facebook videos)
        const videos = [
            {
                id: 1,
                videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4',
                thumbnail: 'https://images.unsplash.com/photo-1531297484001-80022131f5a1?w=400',
                avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100',
                creatorName: 'Tech Indonesia',
                isVerified: true,
                postTime: '2 jam yang lalu',
                description: 'Tutorial coding React dari dasar! 🔥 #programming #coding #reactjs',
                hashtags: ['#programming', '#coding', '#reactjs', '#webdev'],
                likes: '125.4K',
                comments: '8.2K',
                shares: '15.7K',
                category: '🔥 Trending',
                views: '1.2M'
            },
            {
                id: 2,
                videoUrl: 'https://www.w3schools.com/html/movie.mp4',
                thumbnail: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=400',
                avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100',
                creatorName: 'Sarah Developer',
                isVerified: true,
                postTime: '5 jam yang lalu',
                description: 'Beautiful sunset coding session 🌅 What a productive day! #developer #coding #sunset',
                hashtags: ['#developer', '#coding', '#sunset', '#productivity'],
                likes: '89.2K',
                comments: '4.5K',
                shares: '2.1K',
                category: '✨ FYP',
                views: '890K'
            },
            {
                id: 3,
                videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4',
                thumbnail: 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=400',
                avatar: 'https://images.unsplash.com/photo-1527980965255-d3b416303d12?w=100',
                creatorName: 'Code Master',
                isVerified: false,
                postTime: '1 hari yang lalu',
                description: 'Clean code vs messy code - which one are you? 🤔 #cleancode #programming #software',
                hashtags: ['#cleancode', '#programming', '#software', '#tips'],
                likes: '234K',
                comments: '12.1K',
                shares: '8.9K',
                category: '💡 Tips',
                views: '2.1M'
            },
            {
                id: 4,
                videoUrl: 'https://www.w3schools.com/html/movie.mp4',
                thumbnail: 'https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=400',
                avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100',
                creatorName: 'Web Dev Pro',
                isVerified: true,
                postTime: '3 hari yang lalu',
                description: 'Building a complete website in 60 seconds! 🚀 Full tutorial on my profile #webdevelopment #build #website',
                hashtags: ['#webdevelopment', '#build', '#website', '#tutorial'],
                likes: '567K',
                comments: '23.4K',
                shares: '45.2K',
                category: '🚀 Viral',
                views: '5.6M'
            },
            {
                id: 5,
                videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4',
                thumbnail: 'https://images.unsplash.com/photo-1550439062-609e1531270e?w=400',
                avatar: 'https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?w=100',
                creatorName: 'Digital Creator',
                isVerified: true,
                postTime: '4 jam yang lalu',
                description: 'My workspace tour! ✨ What tools do you use? #workspace #productivity #setup',
                hashtags: ['#workspace', '#productivity', '#setup', '#tech'],
                likes: '156K',
                comments: '7.8K',
                shares: '3.4K',
                category: '🏠 Setup',
                views: '1.5M'
            }
        ];

        let currentVideoIndex = 0;
        let isMuted = false;
        let isPlaying = true;
        let hasInteracted = false;

        // DOM Elements
        const loadingScreen = document.getElementById('loadingScreen');
        const videoFeed = document.getElementById('videoFeed');
        const soundIndicator = document.getElementById('soundIndicator');
        const swipeHint = document.getElementById('swipeHint');
        const shareModal = document.getElementById('shareModal');
        const modalBackdrop = document.getElementById('modalBackdrop');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');
        const categoryBadge = document.getElementById('categoryBadge');
        const categoryText = document.getElementById('categoryText');
        const soundText = document.getElementById('soundText');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');

        // Create video cards
        function createVideoCards() {
            videoFeed.innerHTML = '';
            videos.forEach((video, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="progress-bar"><div class="progress-fill" id="progress-${index}"></div></div>
                    <video 
                        id="video-${index}" 
                        src="${video.videoUrl}" 
                        loop 
                        muted="${isMuted}"
                        playsinline
                        preload="metadata"
                    ></video>
                    <div class="video-overlay"></div>
                    
                    <div class="content-info">
                        <div class="creator-info">
                            <img class="avatar" src="${video.avatar}" alt="${video.creatorName}">
                            <div class="creator-details">
                                <div class="creator-name">
                                    ${video.creatorName}
                                    ${video.isVerified ? `<span class="verified-badge"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>` : ''}
                                </div>
                                <div class="post-time">${video.postTime}</div>
                            </div>
                        </div>
                        <div class="video-description">${video.description}</div>
                        <div class="hashtags">
                            ${video.hashtags.map(tag => `<span class="hashtag">${tag}</span>`).join('')}
                        </div>
                        <div class="engagement-tags">
                            <span class="engagement-tag hot">🔥 ${video.views}</span>
                            <span class="engagement-tag trending">⚡ ${video.category}</span>
                        </div>
                    </div>

                    <div class="side-actions">
                        <div class="action-btn like" onclick="toggleLike(${index})">
                            <div class="action-icon">
                                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </div>
                            <span class="action-count" id="likes-${index}">${video.likes}</span>
                        </div>
                        <div class="action-btn comment" onclick="showComments(${index})">
                            <div class="action-icon">
                                <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18zM18 14H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
                            </div>
                            <span class="action-count">${video.comments}</span>
                        </div>
                        <div class="action-btn share" onclick="openShareModal(${index})">
                            <div class="action-icon">
                                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
                            </div>
                            <span class="action-count">${video.shares}</span>
                        </div>
                        <div class="action-btn save" onclick="toggleSave(${index})">
                            <div class="action-icon">
                                <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                            </div>
                            <span class="action-count">Simpan</span>
                        </div>
                    </div>

                    <div class="play-overlay" id="playOverlay-${index}">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                `;
                videoFeed.appendChild(card);

                // Add video event listeners
                const videoEl = document.getElementById(`video-${index}`);
                const playOverlay = document.getElementById(`playOverlay-${index}`);
                
                videoEl.addEventListener('click', () => togglePlayPause(index));
                playOverlay.addEventListener('click', () => togglePlayPause(index));
                
                videoEl.addEventListener('timeupdate', () => {
                    const progress = (videoEl.currentTime / videoEl.duration) * 100;
                    document.getElementById(`progress-${index}`).style.width = `${progress}%`;
                });
                
                videoEl.addEventListener('ended', () => {
                    videoEl.currentTime = 0;
                    videoEl.play();
                });
            });
        }

        // Toggle play/pause
        function togglePlayPause(index) {
            const video = document.getElementById(`video-${index}`);
            const playOverlay = document.getElementById(`playOverlay-${index}`);
            
            if (video.paused) {
                video.play();
                playOverlay.classList.remove('visible');
                playIcon.innerHTML = '<rect fill="currentColor" x="6" y="4" width="4" height="16"/><rect fill="currentColor" x="14" y="4" width="4" height="16"/>';
                playPauseBtn.classList.add('playing');
            } else {
                video.pause();
                playOverlay.classList.add('visible');
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                playPauseBtn.classList.remove('playing');
            }
        }

        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            soundIndicator.classList.toggle('muted', isMuted);
            soundText.textContent = isMuted ? 'Muted' : 'Suara';
            
            videos.forEach((_, index) => {
                const video = document.getElementById(`video-${index}`);
                if (video) video.muted = isMuted;
            });
        }

        // Toggle like
        function toggleLike(index) {
            const likeBtn = document.querySelector(`.video-card:nth-child(${index + 1}) .action-btn.like`);
            const likesEl = document.getElementById(`likes-${index}`);
            
            if (likeBtn.classList.contains('active')) {
                likeBtn.classList.remove('active');
                showToast('Menghapus like');
            } else {
                likeBtn.classList.add('active');
                showToast('Menyukai video ❤️');
            }
        }

        // Toggle save
        function toggleSave(index) {
            const saveBtn = document.querySelector(`.video-card:nth-child(${index + 1}) .action-btn.save`);
            
            if (saveBtn.classList.contains('active')) {
                saveBtn.classList.remove('active');
                showToast('Dihapus dari tersimpan');
            } else {
                saveBtn.classList.add('active');
                showToast('Disimpan ke koleksi 📥');
            }
        }

        // Show comments (placeholder)
        function showComments(index) {
            showToast('Komentar tidak tersedia dalam demo ini 💬');
        }

        // Open share modal
        function openShareModal(index) {
            shareModal.classList.add('visible');
            modalBackdrop.classList.add('visible');
        }

        // Close share modal
        function closeShareModal() {
            shareModal.classList.remove('visible');
            modalBackdrop.classList.remove('visible');
        }

        // Show toast
        function showToast(message) {
            toastText.textContent = message;
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2000);
        }

        // Navigate to video
        function goToVideo(index) {
            if (index < 0) index = videos.length - 1;
            if (index >= videos.length) index = 0;
            
            currentVideoIndex = index;
            const cards = document.querySelectorAll('.video-card');
            cards[index].scrollIntoView({ behavior: 'smooth' });
            
            // Update category badge
            categoryText.textContent = videos[index].category;
            
            // Hide swipe hint after first interaction
            if (!hasInteracted) {
                hasInteracted = true;
                swipeHint.classList.add('hidden');
            }
        }

        // Event listeners
        soundIndicator.addEventListener('click', toggleMute);
        modalBackdrop.addEventListener('click', closeShareModal);
        document.getElementById('closeShareModal').addEventListener('click', closeShareModal);
        document.getElementById('prevBtn').addEventListener('click', () => goToVideo(currentVideoIndex - 1));
        document.getElementById('nextBtn').addEventListener('click', () => goToVideo(currentVideoIndex + 1));
        document.getElementById('playPauseBtn').addEventListener('click', () => togglePlayPause(currentVideoIndex));
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            navigator.clipboard.writeText('https://fb.com/video/' + videos[currentVideoIndex].id);
            closeShareModal();
            showToast('Link disalin! 📋');
        });

        // Share options
        document.querySelectorAll('.share-option').forEach((option, idx) => {
            option.addEventListener('click', () => {
                const platforms = ['Facebook', 'Twitter', 'WhatsApp'];
                closeShareModal();
                showToast(`Berbagi ke ${platforms[idx]}...`);
            });
        });

        // Track current video on scroll
        let scrollTimeout;
        videoFeed.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const cards = document.querySelectorAll('.video-card');
                const scrollTop = videoFeed.scrollTop;
                const cardHeight = window.innerHeight;
                const newIndex = Math.round(scrollTop / cardHeight);
                
                if (newIndex !== currentVideoIndex && newIndex >= 0 && newIndex < videos.length) {
                    // Pause previous video
                    const prevVideo = document.getElementById(`video-${currentVideoIndex}`);
                    if (prevVideo) prevVideo.pause();
                    
                    currentVideoIndex = newIndex;
                    categoryText.textContent = videos[currentVideoIndex].category;
                    
                    // Play new video
                    const newVideo = document.getElementById(`video-${currentVideoIndex}`);
                    if (newVideo) {
                        newVideo.play().catch(() => {});
                        playIcon.innerHTML = '<rect fill="currentColor" x="6" y="4" width="4" height="16"/><rect fill="currentColor" x="14" y="4" width="4" height="16"/>';
                        playPauseBtn.classList.add('playing');
                    }
                    
                    // Hide swipe hint after first scroll
                    if (!hasInteracted) {
                        hasInteracted = true;
                        swipeHint.classList.add('hidden');
                    }
                }
            }, 100);
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                goToVideo(currentVideoIndex - 1);
            } else if (e.key === 'ArrowDown') {
                goToVideo(currentVideoIndex + 1);
            } else if (e.key === ' ') {
                e.preventDefault();
                togglePlayPause(currentVideoIndex);
            } else if (e.key === 'm') {
                toggleMute();
            }
        });

        // Initialize
        window.addEventListener('load', () => {
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                createVideoCards();
                
                // Start playing first video
                setTimeout(() => {
                    const firstVideo = document.getElementById('video-0');
                    if (firstVideo) {
                        firstVideo.play().catch(() => {});
                    }
                }, 500);
            }, 1500);
        });

        // Header tabs
        document.querySelectorAll('.header-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.header-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
            });
        });
    </script>
